axioms:
  - id: "no_exit"
    description: "Agent shall not call exit() or any system-terminating function"
    condition: "true"
    target_functions: ["*"]

  - id: "no_network"
    description: "Agent shall not access the network"
    condition: "true"
    target_functions: ["*"]

  - id: "no_core_modification"
    description: "Agent shall not modify PAAC core memory"
    condition: "true"
    target_functions: ["*"]

  - id: "memory_limit"
    description: "Agent memory usage shall not exceed max_memory_bytes"
    condition: "true"
    target_functions: ["*"]
