behavioral:
  no_exit:
    description: "Agent shall not call exit()"
    formula: "forall state. (state.pc != EXIT_ADDRESS)"
  no_network:
    description: "Agent shall not access network"
    formula: "forall state. (not state.io.network_access)"
integrity:
  no_core_modification:
    description: "Agent shall not modify PAAC core memory"
    formula: "forall state. (state.memory.write_addr not in PAAC_CORE_RANGE)"
resource:
  memory_limit:
    description: "Agent memory usage shall not exceed max_memory_bytes"
    formula: "forall state. (state.memory_used <= MAX_MEMORY)"
