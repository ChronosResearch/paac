axioms:
  # balance must never go negative after any financial operation.
  - id: "no_negative_balance"
    description: "Account balance must remain non-negative."
    condition: "balance >= 0"
    target_functions: ["withdraw", "deposit", "transfer"]

  # counter must stay within a safe range.
  - id: "counter_in_range"
    description: "Counter must be non-negative."
    condition: "counter >= 0"
    target_functions: ["increment", "decrement", "reset_counter"]

  # The returned value must be non-negative.
  #
  # `result` is bound by the verifier at every return statement. Note the
  # description previously read "must not exceed 1000000", which the condition
  # never expressed; the condition is the normative part and the description
  # has been corrected to match it rather than the reverse.
  - id: "result_bounded"
    description: "Returned value must be non-negative."
    condition: "result >= 0"
    target_functions: ["compute", "calculate"]

  # Integrity safety: code must not call exit() or terminate the process.
  # exit_called is a sentinel variable set to 1 if an exit path is taken.
  #
  # `defaults` is required, not decorative. This axiom targets every function,
  # but a function that never takes an exit path never assigns `exit_called`,
  # so without a declared default the axiom cannot be encoded. It used to be
  # dropped silently in that case, which is every case, so it never fired once
  # (AUDIT_FINDINGS.md C-03). Declaring 0 states the intended semantics
  # explicitly: code that never touched the sentinel did not exit.
  - id: "no_exit"
    description: "Code must not call exit() or terminate the process."
    condition: "exit_called == 0"
    target_functions: ["*"]
    defaults:
      exit_called: 0

  # Behavioral safety: code must not make network calls.
  # network_calls is a sentinel variable incremented on each network operation.
  # See the note on no_exit above for why `defaults` is required.
  - id: "no_network"
    description: "Code must not make network calls."
    condition: "network_calls == 0"
    target_functions: ["*"]
    defaults:
      network_calls: 0
