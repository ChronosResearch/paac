# PAAC default configuration — v5.0.0
# All values can be overridden via environment variables.
# See docs/DEPLOYMENT.md for the full variable reference.

# Verification engine
verification_timeout_ms: 5000          # PAAC_VERIFICATION_TIMEOUT_MS
z3_memory_limit_mb: 1024               # PAAC_Z3_MEMORY_LIMIT_MB
z3_cpu_limit_seconds: 5                # PAAC_Z3_CPU_LIMIT_SECONDS
z3_max_retries: 3                      # PAAC_Z3_MAX_RETRIES

# SIL runtime limits
max_loop_bound: 10000                  # PAAC_MAX_LOOP_BOUND
max_instructions: 100000               # PAAC_MAX_INSTRUCTIONS

# Constant-time padding (seconds)
constant_verification_time_padding_s: 0.200   # PAAC_CONSTANT_TIME_PADDING_S

# Circuit breaker
circuit_breaker_failure_threshold: 5   # PAAC_CB_FAILURE_THRESHOLD
circuit_breaker_cooldown_s: 60         # PAAC_CB_COOLDOWN_S

# Concurrency
max_concurrent_verifications: 4        # PAAC_MAX_CONCURRENT_VERIFICATIONS

# Rate limiting
rate_limit_per_minute: 100             # PAAC_RATE_LIMIT

# Persistence
wal_path: "checkpoints.wal"            # PAAC_WAL_PATH
registry_path: "live_registry.json"    # PAAC_REGISTRY_PATH

# Axioms
axiom_path: "config/axioms.yaml"       # AXIOM_PATH

# Grounding / citation enforcement
grounding:
  enforce_runtime_execution: true
  require_source_citations: true

# Self-healing watchdog
self_healing:
  enabled: true
  heartbeat_interval_secs: 5
  recovery_timeout_secs: 30

# Safe I/O whitelist
safe_io_whitelist:
  - "print_to_log"
  - "safe_file_write"

# ── v5.0.0 new features ──────────────────────────────────────────────────────

# Bootstrap self-verification
bootstrap_verification:
  enabled: true                        # PAAC_BOOTSTRAP_ENABLED
  timeout_ms: 5000                     # PAAC_BOOTSTRAP_TIMEOUT_MS
  run_on_startup: false                # PAAC_BOOTSTRAP_ON_STARTUP
  include_live_tcb: false              # PAAC_BOOTSTRAP_LIVE_TCB

# Cryptographic attestation
attestation:
  enabled: true                        # PAAC_ATTEST_ENABLED
  # key loaded from PAAC_ATTEST_KEY env var (hex-encoded 32 bytes)
  # if not set, an ephemeral key is generated at startup
  log_to_audit: true                   # PAAC_ATTEST_LOG_AUDIT

# Multi-agent coordination
multi_agent:
  enabled: true                        # PAAC_MULTI_AGENT_ENABLED
  max_agents: 10                       # PAAC_MULTI_AGENT_MAX_AGENTS
  agent_timeout_s: 30                  # PAAC_MULTI_AGENT_TIMEOUT_S
  # If an agent has not sent a heartbeat in agent_timeout_s seconds,
  # its queued modifications are marked as abandoned.

# Proof-Carrying Modification (PCM)
pcm:
  enabled: false                       # PAAC_PCM_MODE — set true to require proofs
  audit_log: "pcm_audit.jsonl"         # PAAC_PCM_LOG
  # HMAC key for certificates loaded from PAAC_CERT_KEY env var (hex 32 bytes)
  # If not set, a default key is used (insecure — change in production)
