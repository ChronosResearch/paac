verification_timeout_ms: 5000
loop_bound_default: 100
constant_verification_time_padding_ms: 200
max_memory_bytes: 4294967296
safe_io_whitelist:
  - "print_to_log"
  - "safe_file_write"
grounding:
  enforce_runtime_execution: true
  require_source_citations: true
# Redis connection is read from environment variables REDIS_HOST and REDIS_PORT.
# Axiom file path is read from environment variable AXIOM_PATH.
# See .env.example for the full list of required variables.
