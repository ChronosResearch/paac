apiVersion: apps/v1
kind: Deployment
metadata:
  name: paac-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paac-core
  template:
    metadata:
      labels:
        app: paac-core
    spec:
      containers:
      - name: paac-core
        image: paac-core:v3.0
        env:
        - name: REDIS_HOST
          value: "paac-redis-service"
        - name: REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: paac-redis-service
spec:
  selector:
    app: paac-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
